<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
		/>
		<script>
			// Diadem is dark only: add the dark class before render so the initial
			// loading screen never flashes light. The stored themeMode setting is
			// ignored on purpose.
			document.documentElement.classList.add("dark");

			(function () {
				try {
					if (window.Capacitor && window.Capacitor.isNativePlatform()) {
						document.documentElement.classList.add("native-app");
					}
				} catch (e) {}
			})();
		</script>
		<style>
			html {
				background: oklch(1 0 0);
			}

			html.dark {
				background: oklch(0.105 0.022 258);
			}

			#initial-loader {
				position: fixed;
				inset: 0;
				z-index: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				flex-direction: column;
				gap: 16px;
				background: inherit;
			}

			#initial-loader img {
				display: block;
				width: 88px;
				height: 88px;
				border-radius: 20px;
			}

			html.native-app #initial-loader img {
				display: block;
			}
			/* The splash wordmark, defined once and here: the suite's, uppercase
			 * and 900 like the hub's page header. Set in Figtree once it has
			 * loaded; system-ui otherwise, which is fine on a screen shown for
			 * under a second. */
			#initial-loader::after {
				content: "POGOLEIRIA";
				color: var(--foreground, #f5f5f5);
				font-family: "Figtree Variable", system-ui, sans-serif;
				font-size: 22px;
				font-weight: 900;
				line-height: 1.2;
				letter-spacing: -0.055em;
				text-transform: uppercase;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="initial-loader">
			<img src="%sveltekit.assets%/loader.svg" alt="PoGoLeiria" />
		</div>
		<div style="display: contents; height: 100%">%sveltekit.body%</div>
	</body>
</html>
